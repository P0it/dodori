<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!--
      user-scalable=no가 없으면 스토리 캔버스에서 사진을 오므릴 때 브라우저가 그 핀치를
      페이지 줌으로 가로채 앱 화면 전체가 확대·축소된다.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>dodori</title>

    <!-- 홈 화면에 추가하면 주소창 없는 앱처럼 뜬다 (PWA) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#121212" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="도돌이" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!--
      배포할 때마다 번들 파일명의 해시가 바뀐다. 홈 화면 앱(iOS PWA)이 옛 index.html을 캐시로
      들고 있으면 이미 사라진 번들을 요청하게 되고, 그러면 앱이 통째로 안 뜨면서 배경색만 남는다
      (= 로고도 없는 순수한 검은 화면). 스크립트 로드가 실패하면 주소를 한 번 바꿔 다시 받아
      스스로 복구한다. 세션당 한 번만 — 진짜로 깨진 배포에서 무한 새로고침이 되면 안 된다.
    -->
    <script>
      window.addEventListener(
        'error',
        function (e) {
          if (!e.target || e.target.tagName !== 'SCRIPT') return;
          if (sessionStorage.getItem('dodori-bundle-retry')) return;
          sessionStorage.setItem('dodori-bundle-retry', '1');
          location.replace(location.pathname + '?r=' + Date.now());
        },
        true,
      );
    </script>

    <!-- react-native-web 권장 리셋: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /*
        홈 화면 앱(스탠드얼론)에서 height: 100%는 홈 인디케이터 영역을 뺀 높이로 잡혀
        탭바 아래에 페이지 배경이 밝은 띠로 드러난다. dvh는 화면 전체를 덮는다.
        (dvh 미지원 브라우저는 앞줄 100%로 폴백)
      */
      html,
      body {
        height: 100%;
        height: 100dvh;
      }
      body {
        overflow: hidden;
        background-color: #121212;
      }
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
      }
      /*
        하단 안전영역은 JS(useSafeAreaInsets)가 아니라 CSS가 그린다.
        웹의 safe-area-context는 마운트 때 한 번 + padding transitionend에서만 값을 갱신해서,
        사파리 주소창이 접히고 펴지며 inset이 바뀌면 옛 값이 그대로 남는다(탭바 아래 여백).
        env()는 브라우저가 매 프레임 맞춰 준다. max()로 최소 여백 12px을 지킨다.
      */
      [data-safe-bottom] {
        padding-bottom: 12px;
        padding-bottom: max(12px, env(safe-area-inset-bottom));
      }
      [data-safe-top] {
        padding-top: env(safe-area-inset-top);
      }
    </style>
  </head>

  <body>
    <noscript>이 앱을 실행하려면 자바스크립트를 켜야 합니다.</noscript>
    <div id="root"></div>
  </body>
</html>
