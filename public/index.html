<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!--
      user-scalable=no가 없으면 스토리 캔버스에서 사진을 오므릴 때 브라우저가 그 핀치를
      페이지 줌으로 가로채 앱 화면 전체가 확대·축소된다.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>dodori</title>

    <!-- 홈 화면에 추가하면 주소창 없는 앱처럼 뜬다 (PWA) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#121212" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="도돌이" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- react-native-web 권장 리셋: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        background-color: #121212;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>이 앱을 실행하려면 자바스크립트를 켜야 합니다.</noscript>
    <div id="root"></div>
  </body>
</html>
