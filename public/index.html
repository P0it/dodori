<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!--
      user-scalable=no가 없으면 스토리 캔버스에서 사진을 오므릴 때 브라우저가 그 핀치를
      페이지 줌으로 가로채 앱 화면 전체가 확대·축소된다.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>dodori</title>

    <!-- 홈 화면에 추가하면 주소창 없는 앱처럼 뜬다 (PWA) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#121212" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="도돌이" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- react-native-web 권장 리셋: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /*
        홈 화면 앱(스탠드얼론)에서 height: 100%는 홈 인디케이터 영역을 뺀 높이로 잡혀
        탭바 아래에 페이지 배경이 밝은 띠로 드러난다. dvh는 화면 전체를 덮는다.
        (dvh 미지원 브라우저는 앞줄 100%로 폴백)
      */
      html,
      body {
        height: 100%;
        height: 100dvh;
      }
      body {
        overflow: hidden;
        background-color: #121212;
      }
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
      }
      /*
        하단 안전영역은 JS(useSafeAreaInsets)가 아니라 CSS가 그린다.
        웹의 safe-area-context는 마운트 때 한 번 + padding transitionend에서만 값을 갱신해서,
        사파리 주소창이 접히고 펴지며 inset이 바뀌면 옛 값이 그대로 남는다(탭바 아래 여백).
        env()는 브라우저가 매 프레임 맞춰 준다. max()로 최소 여백 12px을 지킨다.
      */
      [data-safe-bottom] {
        padding-bottom: 12px;
        padding-bottom: max(12px, env(safe-area-inset-bottom));
      }
      [data-safe-top] {
        padding-top: env(safe-area-inset-top);
      }
    </style>
  </head>

  <body>
    <noscript>이 앱을 실행하려면 자바스크립트를 켜야 합니다.</noscript>
    <div id="root"></div>
  </body>
</html>
