<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!--
      브라우저 확대(페이지 줌)는 끈다 — 이 문서는 스크롤하지 않고 안쪽 목록이 스크롤해서,
      페이지가 확대되면 고정된 탭바·헤더와 안쪽 스크롤이 싸우며 화면이 흔들린다.
      확대는 각 화면이 자기 사진만 키우는 쪽으로 간다 (feed/PhotoZoom, story/StoryCanvas).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>dodori</title>

    <!-- 홈 화면에 추가하면 주소창 없는 앱처럼 뜬다 (PWA) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#121212" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="도돌이" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!--
      배포할 때마다 번들 파일명의 해시가 바뀐다. 홈 화면 앱(iOS PWA)이 옛 index.html을 캐시로
      들고 있으면 이미 사라진 번들을 요청하게 되고, 그러면 앱이 통째로 안 뜨면서 배경색만 남는다
      (= 로고도 없는 순수한 검은 화면). 스크립트 로드가 실패하면 주소를 한 번 바꿔 다시 받아
      스스로 복구한다. 세션당 한 번만 — 진짜로 깨진 배포에서 무한 새로고침이 되면 안 된다.
    -->
    <script>
      window.addEventListener(
        'error',
        function (e) {
          if (!e.target || e.target.tagName !== 'SCRIPT') return;
          if (sessionStorage.getItem('dodori-bundle-retry')) return;
          sessionStorage.setItem('dodori-bundle-retry', '1');
          location.replace(location.pathname + '?r=' + Date.now());
        },
        true,
      );
    </script>

    <!-- react-native-web 권장 리셋: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /*
        홈 화면 앱(스탠드얼론)에서 height: 100%는 홈 인디케이터 영역을 뺀 높이로 잡혀
        탭바 아래에 페이지 배경이 밝은 띠로 드러난다. dvh는 화면 전체를 덮는다.
        (dvh 미지원 브라우저는 앞줄 100%로 폴백)
      */
      html,
      body {
        height: 100%;
        height: 100dvh;
      }
      body {
        overflow: hidden;
        background-color: #121212;
        /* 더블탭 확대를 막는다 — iOS 사파리는 user-scalable=no를 무시한다 */
        touch-action: manipulation;
      }
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
      }
      /*
        하단 안전영역은 JS(useSafeAreaInsets)가 아니라 CSS가 그린다.
        웹의 safe-area-context는 마운트 때 한 번 + padding transitionend에서만 값을 갱신해서,
        사파리 주소창이 접히고 펴지며 inset이 바뀌면 옛 값이 그대로 남는다(탭바 아래 여백).
        env()는 브라우저가 매 프레임 맞춰 준다. max()로 최소 여백 12px을 지킨다.
      */
      [data-safe-bottom] {
        padding-bottom: 12px;
        padding-bottom: max(12px, env(safe-area-inset-bottom));
      }
      /*
        데스크톱 브라우저에서는 앱이 폰 너비로 가운데 선다(_layout.tsx의 PHONE_MAX_WIDTH).
        페이지 배경까지 앱과 같은 #121212면 어디까지가 앱인지 보이지 않아, 바깥쪽만 한 단계
        어둡게 깔아 앱을 화면에서 떼어낸다.
      */
      @media (min-width: 560px) {
        body {
          background-color: #0A0A0A;
        }
      }
      [data-safe-top] {
        padding-top: env(safe-area-inset-top);
      }
      /*
        번들을 받는 동안의 화면 — 웹에는 네이티브 스플래시가 없다. BrandSplash는 React
        컴포넌트라 4MB짜리 번들을 다 받아 실행한 뒤에야 나타나고, 그 전까지는 배경색만 남은
        검은 화면이 몇 초씩 이어진다 (폰에서 "스플래시가 늦게 뜬다"로 보이던 구간).
        그래서 마크(𝄆)를 HTML로 직접 그려 첫 페인트에 띄운다. 크기·좌표는 BrandSplash의
        MARK_SIZE 100과 DodoriMark 지오메트리에서 그대로 뽑은 값이라, React가 마운트되며
        이 노드를 지울 때(_layout.tsx) 같은 자리에 같은 그림이 있어 이음매가 안 보인다.
        색은 토큰(color.bg·color.greenBright)과 같은 값을 손으로 적었다 — HTML은 토큰을 못 읽는다.
      */
      /*
        높이는 #root와 같은 규칙으로 잡는다 — `inset: 0`(고정 위치의 기준은 큰 뷰포트)으로 두면
        사파리 주소창이 보이는 동안 #root의 100dvh보다 커서, 교대할 때 마크가 그 차이의 절반만큼 튄다
      */
      #boot-splash {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 100%;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #121212;
        pointer-events: none;
      }
      #boot-splash .mark {
        position: relative;
        width: 80px;
        height: 100px;
      }
      #boot-splash span {
        position: absolute;
        background-color: #1ed760;
      }
      #boot-splash .bar-a {
        left: 0;
        width: 22px;
        height: 100px;
        border-radius: 3px;
      }
      #boot-splash .bar-b {
        left: 33px;
        width: 8.5px;
        height: 100px;
        border-radius: 3px;
      }
      #boot-splash .dot {
        left: 54px;
        width: 26px;
        height: 26px;
        border-radius: 13px;
      }
      #boot-splash .dot-up {
        top: 17px;
      }
      #boot-splash .dot-low {
        top: 57px;
      }
    </style>
  </head>

  <body>
    <noscript>이 앱을 실행하려면 자바스크립트를 켜야 합니다.</noscript>
    <div id="root"></div>
    <div id="boot-splash" aria-hidden="true">
      <div class="mark">
        <span class="bar-a"></span>
        <span class="bar-b"></span>
        <span class="dot dot-up"></span>
        <span class="dot dot-low"></span>
      </div>
    </div>
  </body>
</html>
